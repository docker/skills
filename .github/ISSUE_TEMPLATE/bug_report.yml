name: 🐞 Bug
description: File a bug/issue
title: "[BUG] <title>"
labels: ['status/0-triage', 'kind/bug']
body:
  - type: textarea
    attributes:
      label: Description
      description: |
        Briefly describe the problem you are having.

        Include both the current behavior (what you are seeing) as well as what you expected to happen.
    validations:
      required: true
  - type: input
    attributes:
      label: Skill affected
      description: Which skill is the issue about? (e.g. `docker-compose-patterns`)
    validations:
      required: false
  - type: input
    attributes:
      label: Agent / harness
      description: Which AI agent or harness exposed the issue? (e.g. Claude Code, Codex, Gemini CLI, Copilot CLI, version)
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. With this skill loaded...
        2. With this prompt...
        3. The agent did...
        4. I expected...
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
