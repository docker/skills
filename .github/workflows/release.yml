name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag in strict vX.Y.Z format
        required: true
        type: string
      dry_run:
        description: Build and validate without creating remote release artifacts
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag_exists: ${{ steps.remote-state.outputs.tag_exists }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate dispatch and release version
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != refs/heads/main ]]; then
            echo "Release workflow must be dispatched from main, not $DISPATCH_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must use strict vX.Y.Z format: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Run CI and release tag checks
        run: bash scripts/ci.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Inspect remote release state
        id: remote-state
        env:
          EXPECTED_SHA: ${{ github.sha }}
          IMAGE_REF: docker/skills-content:${{ inputs.version }}
        run: |
          set -euo pipefail

          resolve_tag() {
            local object_type="$1"
            local object_sha="$2"
            local depth=0
            while [[ "$object_type" == tag && $depth -lt 8 ]]; do
              local tag_object
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_object")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
              depth=$((depth + 1))
            done
            if [[ "$object_type" != commit ]]; then
              echo "Tag $RELEASE_TAG does not resolve to a commit" >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          if tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>tag-error.log)"; then
            tag_target="$(resolve_tag "$(jq -r '.object.type' <<<"$tag_ref")" "$(jq -r '.object.sha' <<<"$tag_ref")")"
            if [[ "$tag_target" != "$EXPECTED_SHA" ]]; then
              echo "Tag $RELEASE_TAG already targets $tag_target, not dispatch commit $EXPECTED_SHA" >&2
              exit 1
            fi
            echo 'tag_exists=true' >>"$GITHUB_OUTPUT"
          elif grep -q '(HTTP 404)' tag-error.log; then
            echo 'tag_exists=false' >>"$GITHUB_OUTPUT"
          else
            cat tag-error.log >&2
            exit 1
          fi

          release_json="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --slurp \
              | jq -c --arg tag "$RELEASE_TAG" '
                  map(.[]) | map(select(.tag_name == $tag))
                  | if length == 0 then empty elif length == 1 then .[0] else error("multiple releases use this tag") end
                '
          )"
          if [[ -n "$release_json" ]]; then
            if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
              echo "Release $RELEASE_TAG is already published; it will not be modified" >&2
              exit 1
            fi
            echo 'release_exists=true' >>"$GITHUB_OUTPUT"
          else
            echo 'release_exists=false' >>"$GITHUB_OUTPUT"
          fi

          if docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .}}' >image-state.json 2>image-error.log; then
            image_digest="$(jq -er '.manifest.digest | select(test("^sha256:[0-9a-f]{64}$"))' image-state.json)"
            mapfile -t platforms < <(
              jq -r '
                .image
                | to_entries
                | map(select(.key == "linux/amd64" or .key == "linux/arm64"))
                | .[].key
              ' image-state.json | sort -u
            )
            mapfile -t revisions < <(
              jq -r '
                .image
                | to_entries
                | map(select(.key == "linux/amd64" or .key == "linux/arm64"))
                | .[].value.config.Labels["org.opencontainers.image.revision"]
              ' image-state.json | sort -u
            )
            if [[ "${platforms[*]}" != "linux/amd64 linux/arm64" ]]; then
              echo "Image $IMAGE_REF does not contain the required linux/amd64 and linux/arm64 platforms" >&2
              exit 1
            fi
            if [[ ${#revisions[@]} -ne 1 || "${revisions[0]}" != "$EXPECTED_SHA" ]]; then
              echo "Image $IMAGE_REF exists but was not built from dispatch commit $EXPECTED_SHA" >&2
              exit 1
            fi
            echo 'image_exists=true' >>"$GITHUB_OUTPUT"
            echo "image_digest=$image_digest" >>"$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown' image-error.log; then
            echo 'image_exists=false' >>"$GITHUB_OUTPUT"
            echo 'image_digest=' >>"$GITHUB_OUTPUT"
          else
            cat image-error.log >&2
            exit 1
          fi

          echo "Release plan for $RELEASE_TAG at $EXPECTED_SHA"
          echo "  tag exists: $(grep '^tag_exists=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "  image exists: $(grep '^image_exists=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "  draft release exists: $(grep '^release_exists=' "$GITHUB_OUTPUT" | cut -d= -f2)"

  tag:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    needs:
      - plan
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Create or verify annotated tag
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG_EXISTS: ${{ needs.plan.outputs.tag_exists }}
        run: |
          set -euo pipefail

          resolve_ref_target() {
            local tag_ref object_type object_sha depth=0
            tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            object_type="$(jq -r '.object.type' <<<"$tag_ref")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            while [[ "$object_type" == tag && $depth -lt 8 ]]; do
              local tag_object
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_object")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
              depth=$((depth + 1))
            done
            [[ "$object_type" == commit ]] || return 1
            printf '%s\n' "$object_sha"
          }

          if [[ "$TAG_EXISTS" == true ]]; then
            [[ "$(resolve_ref_target)" == "$TARGET_SHA" ]]
            echo "Reusing tag $RELEASE_TAG at $TARGET_SHA"
            exit 0
          fi
          if [[ "$DRY_RUN" == true ]]; then
            echo "Would create annotated tag $RELEASE_TAG at $TARGET_SHA"
            exit 0
          fi

          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Release $RELEASE_TAG" \
            -f object="$TARGET_SHA" \
            -f type=commit \
            -f tagger[name]='github-actions[bot]' \
            -f tagger[email]='41898282+github-actions[bot]@users.noreply.github.com')"
          tag_object_sha="$(jq -r '.sha' <<<"$tag_object")"

          if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object_sha" >created-ref.json 2>create-ref-error.log; then
            echo "Created annotated tag $RELEASE_TAG at $TARGET_SHA"
          else
            cat create-ref-error.log >&2
            actual_sha="$(resolve_ref_target || true)"
            if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
              echo "Tag creation collided with a tag targeting ${actual_sha:-an invalid object}" >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG was created concurrently at the expected commit"
          fi

  image:
    if: ${{ always() && needs.plan.result == 'success' && (inputs.dry_run || needs.tag.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    needs:
      - plan
      - tag
    outputs:
      digest: ${{ steps.result.outputs.digest }}
    permissions:
      contents: read # to fetch code (actions/checkout)
      id-token: write # for OIDC token exchange with Docker Hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          # Public connection ID is managed in the GitHub release environment so it can rotate without workflow changes.
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: docker

      - name: Recheck version image
        id: inspect
        env:
          EXPECTED_SHA: ${{ github.sha }}
          IMAGE_REF: docker/skills-content:${{ inputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .}}' >image-state.json 2>image-error.log; then
            digest="$(jq -er '.manifest.digest | select(test("^sha256:[0-9a-f]{64}$"))' image-state.json)"
            mapfile -t platforms < <(
              jq -r '
                .image
                | to_entries
                | map(select(.key == "linux/amd64" or .key == "linux/arm64"))
                | .[].key
              ' image-state.json | sort -u
            )
            mapfile -t revisions < <(
              jq -r '
                .image
                | to_entries
                | map(select(.key == "linux/amd64" or .key == "linux/arm64"))
                | .[].value.config.Labels["org.opencontainers.image.revision"]
              ' image-state.json | sort -u
            )
            if [[ "${platforms[*]}" != "linux/amd64 linux/arm64" ]]; then
              echo "Image $IMAGE_REF does not contain the required linux/amd64 and linux/arm64 platforms" >&2
              exit 1
            fi
            if [[ ${#revisions[@]} -ne 1 || "${revisions[0]}" != "$EXPECTED_SHA" ]]; then
              echo "Image $IMAGE_REF exists but was not built from dispatch commit $EXPECTED_SHA" >&2
              exit 1
            fi
            echo 'exists=true' >>"$GITHUB_OUTPUT"
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
            echo "Reusing existing image $IMAGE_REF@$digest"
          elif grep -Eqi 'not found|manifest unknown' image-error.log; then
            echo 'exists=false' >>"$GITHUB_OUTPUT"
            echo 'digest=' >>"$GITHUB_OUTPUT"
          else
            cat image-error.log >&2
            exit 1
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker/skills-content
          tags: type=raw,value=${{ inputs.version }}

      - name: Build release image
        if: inputs.dry_run || steps.inspect.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          provenance: mode=min
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record image digest
        id: result
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXISTING_DIGEST: ${{ steps.inspect.outputs.digest }}
          IMAGE_EXISTS: ${{ steps.inspect.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            echo "digest=$BUILT_DIGEST" >>"$GITHUB_OUTPUT"
            echo "Dry run built the image without pushing it"
          elif [[ "$IMAGE_EXISTS" == true ]]; then
            echo "digest=$EXISTING_DIGEST" >>"$GITHUB_OUTPUT"
          else
            [[ "$BUILT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "digest=$BUILT_DIGEST" >>"$GITHUB_OUTPUT"
          fi

  release:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    needs:
      - tag
      - image
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      IMAGE_REF: docker/skills-content:${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create or refresh draft GitHub release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          release_exists=false
          release_json="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --slurp \
              | jq -c --arg tag "$RELEASE_TAG" '
                  map(.[]) | map(select(.tag_name == $tag))
                  | if length == 0 then empty elif length == 1 then .[0] else error("multiple releases use this tag") end
                '
          )"
          if [[ -n "$release_json" ]]; then
            if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
              echo "Release $RELEASE_TAG is already published; it will not be modified" >&2
              exit 1
            fi
            release_exists=true
          fi

          cat >release-notes.md <<EOF
          ## Distribution snapshot

          - Git tag: \`$RELEASE_TAG\`
          - Commit: \`$TARGET_SHA\`
          - Docker image: \`$IMAGE_REF\`
          - Image digest: \`$IMAGE_DIGEST\`
          EOF

          if [[ "$DRY_RUN" == true ]]; then
            if [[ "$release_exists" == true ]]; then
              echo "Draft release already exists; dry run would not modify it"
            else
              echo "Would create a draft release and attach catalog.yaml and skills.sh.json"
            fi
            exit 0
          fi

          if [[ "$release_exists" == true ]]; then
            release_id="$(jq -r '.id' <<<"$release_json")"
            refreshed_release="$(gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f name="Docker Skills $RELEASE_TAG" \
              -f body="$(cat release-notes.md)")"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
            refreshed_release="$(gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="Docker Skills $RELEASE_TAG" \
              -f body="$(cat release-notes.md)" \
              -F draft=true)"
          fi

          if [[ "$(jq -r '.draft' <<<"$refreshed_release")" != true ]]; then
            echo "Release $RELEASE_TAG is no longer a draft; refusing to upload assets" >&2
            exit 1
          fi

          release_id="$(jq -r '.id' <<<"$refreshed_release")"
          upload_url="$(jq -r '.upload_url | sub("\\{\\?name,label\\}$"; "")' <<<"$refreshed_release")"
          ensure_asset() {
            local path="$1"
            local name expected_digest existing_digests
            name="$(basename "$path")"
            expected_digest="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            existing_digests="$({
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
                --jq ".[] | select(.name == \"$name\") | (.digest // \"unknown\")"
            } || exit 1)"
            if [[ -n "$existing_digests" ]]; then
              if [[ "$existing_digests" != "$expected_digest" ]]; then
                echo "Draft asset $name already exists with digest ${existing_digests//$'\n'/, }; refusing to overwrite it" >&2
                exit 1
              fi
              echo "Reusing draft asset $name at $expected_digest"
              return
            fi
            gh api --method POST "$upload_url?name=$name" \
              -H 'Content-Type: application/octet-stream' \
              --input "$path" >/dev/null
            echo "Uploaded draft asset $name at $expected_digest"
          }

          ensure_asset catalog.yaml
          ensure_asset skills.sh.json
