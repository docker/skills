name: release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CI checks
        run: bash scripts/ci.sh

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read # to fetch code (actions/checkout)
      id-token: write # for OIDC token exchange with Docker Hub
    needs:
      - validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          # Public connection ID is managed in the GitHub release environment so it can rotate without workflow changes.
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: docker

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker/skills-content
          tags: |
            type=edge
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=min
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    needs:
      - image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE_REF: docker/skills-content:${{ github.ref_name }}
        run: |
          cat > release-notes.md <<EOF
          ## Distribution snapshot

          - Docker image: \`$IMAGE_REF\`
          - Image digest: \`$IMAGE_DIGEST\`
          EOF
          gh release create "$GITHUB_REF_NAME" catalog.yaml skills.sh.json \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --notes-file release-notes.md \
            --verify-tag
