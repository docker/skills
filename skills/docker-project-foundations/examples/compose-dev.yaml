# Development-oriented compose.yaml
# Demonstrates Dockerized dependencies, health checks, bind mounts, and named volumes.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev  # Use the dev stage of a multi-stage Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://appuser:apppass@db:5432/appdb  # Demo only — use env_file: in real projects
      - REDIS_URL=redis://cache:6379
      - NODE_ENV=development
    volumes:
      - ./src:/app/src        # Bind mount for live reload
      - /app/node_modules     # Anonymous volume to avoid overwriting installed deps
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppass  # Demo only — use env_file: in real projects
      - POSTGRES_DB=appdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
