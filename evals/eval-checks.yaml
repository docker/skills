  prompt: 'Prompt 20: Verification fixture safety (static checks)'
  assets:
    eval: evals/docker-sandboxes-env.md
    integration: skills/docker-sandboxes-env/checks/verification.md
  checks:
  - id: se-rb-app-suffix
    description: Runbook builds a short APP suffix from a timestamp and PID (text hygiene only)
    type: file_match
    asset_key: integration
    pattern: ^APP="\$\(printf .e-%s-%s. "\$\(date \+%s\)" "\$\$"\)"
  - id: se-rb-app-length-guard
    description: Runbook checks the APP suffix length before continuing
    type: file_match
    asset_key: integration
    pattern: \$\{#APP\}" -le 20
  - id: se-rb-work-guard
    description: Runbook tolerates a failed mktemp and guards on a non-empty directory
    type: file_match
    asset_key: integration
    pattern: ^WORK=\$\(mktemp -d\) \|\| WORK=""$
  - id: se-rb-marker
    description: Runbook creates a marker file that cleanup requires
    type: file_match
    asset_key: integration
    pattern: touch "\$WORK/\.env-skill-check"
  - id: se-rb-cleanup-guarded
    description: Runbook has no recursive delete at column zero (text hygiene only, not control-flow proof)
    type: file_must_not_match
    asset_key: integration
    pattern: ^rm -rf
  - id: se-rb-cleanup-marker
    description: Runbook's indented scratch delete is chained after the daemon stop (text hygiene only)
    type: file_match
    asset_key: integration
    pattern: ^  rm -rf -- "\$WORK" \|\|$
  - id: se-rb-marker-guard-block
    description: Runbook blocks open with the marker-file guard (text hygiene only)
    type: file_match
    asset_key: integration
    pattern: ^if \[ -f "\$WORK/\.env-skill-check" \]; then$
  - id: se-rb-app-on-every-sbx
    description: Every runbook sbx command uses the isolated app name
    type: file_must_not_match
    asset_key: integration
    pattern: ^\s*sbx (?!--app-name "\$APP")
  - id: se-rb-no-global-cleanup
    description: Runbook runs no global prune, reset or bulk secret removal
    type: file_must_not_match
    asset_key: integration
    pattern: ^\s*sbx .*(prune|policy reset|secret rm --all|\breset\b)
  - id: se-rb-dummy-values
    description: Every literal value in a fixture is a dummy value
    type: file_must_not_match
    asset_key: integration
    pattern: '^\s+value: (?!dummy-)'
  - id: se-rb-no-production-token
    description: Runbook does not read live credentials
    type: file_must_not_match
    asset_key: integration
    pattern: gh auth token|\$(\{)?(GH_TOKEN|GITHUB_TOKEN|ANTHROPIC_API_KEY)\b
  - id: se-eval-no-production-token
    description: Eval does not read live credentials
    type: file_must_not_match
    asset_key: eval
    pattern: gh auth token|\$(\{)?(GH_TOKEN|GITHUB_TOKEN|ANTHROPIC_API_KEY)\b
  - id: se-rb-credcmd-plan-only
    description: Runbook never creates or runs the credential-command fixture
    type: file_must_not_match
    asset_key: integration
    pattern: ^\s*sbx .* env (create|run)\b.*credcmd
  - id: se-rb-marker-stdout
    description: Runbook hook prints a constant marker with a fixed printf format
    type: file_match
    asset_key: integration
    pattern: 'command: printf .%s\\n. initialize-ran$'
  - id: se-rb-hook-no-redirect
    description: Runbook fixture commands contain no shell redirection characters (text hygiene only)
    type: file_must_not_match
    asset_key: integration
    pattern: 'command: .*[<>]'
  - id: se-rb-exec-no-detach
    description: Runbook never passes a detach flag to env exec, before or after the path (text hygiene only)
    type: file_must_not_match
    asset_key: integration
    pattern: env exec (.* )?(-d|--detach)\b
  - id: se-rb-exec-no-nested-shell
    description: Runbook env exec probes use no nested shell redirection
    type: file_must_not_match
    asset_key: integration
    pattern: env exec .*sh -c
  - id: se-rb-foreign-cleanup-named
    description: Runbook removes the foreign-name fixture by its exact name
    type: file_match
    asset_key: integration
    pattern: ^  sbx --app-name "\$APP" rm --force env-check-foreign &&$
