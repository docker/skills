      description: SKILL.md must NOT mention `docker container prune` between the Tier 1 and Tier 2 headings (coarse guard against it being misplaced as a Tier 1 example)
      type: file_must_not_match
      pattern: "### Tier 1[\\s\\S]*?docker container prune[\\s\\S]*?### Tier 2"

