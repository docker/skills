- eval: docker-sandboxes-kits
  prompt: "Prompt 3: is `sbx kit validate` enough for a v3 kit?"
  assets:
    skill: skills/docker-sandboxes-kits/SKILL.md
    verification: skills/docker-sandboxes-kits/checks/verification.md
  checks:
    - id: sk3-p3-validate-not-v3-check
      description: SKILL.md distinguishes CLI validation from conformance
      type: file_match
      asset_key: skill
      pattern: '`sbx kit validate` is not a conformance check'
    - id: sk3-p3-offline-rejects-source
      description: SKILL.md explains the offline builder limitation
      type: file_match
      asset_key: skill
      pattern: '`--offline` deliberately omits the builder'
    - id: sk3-p3-cacheonly
      description: SKILL.md gives the buildx cacheonly descriptor check
      type: file_match
      asset_key: skill
      pattern: '--output type=cacheonly'
    - id: sk3-p3-tck-layout
      description: SKILL.md gives the kit-tck layout check
      type: file_match
      asset_key: skill
      pattern: 'kit-tck validate --layout /tmp/<kit>-layout <version>'
    - id: sk3-p3-inspect
      description: SKILL.md names sbx kit inspect as the v3-capable inspection command
      type: file_match
      asset_key: skill
      pattern: 'sbx kit inspect ./<kit>'
    - id: sk3-p3-container-builder
      description: SKILL.md creates a named container-driver builder
      type: file_match
      asset_key: skill
      pattern: 'docker buildx create --name kit-builder --driver docker-container --bootstrap'
    - id: sk3-p3-build-not-proof
      description: SKILL.md says a build is not proof the kit works
      type: file_match
      asset_key: skill
      pattern: 'A build is not proof the kit works'
    - id: sk3-p3-no-v2-validates-v3
      description: SKILL.md never says a v2 command validates a v3 descriptor
      type: file_must_not_match
      asset_key: skill
      pattern: '(?i)`sbx kit validate`[^\n]*\b(validates|confirms|proves)\b[^\n]*\bv3\b'
    - id: sk3-p3-runbook-part-a
      description: Verification runbook is a v3-only runbook
      type: file_match
      asset_key: verification
      pattern: '^# Verification runbook for v3 kits'
    - id: sk3-p3-runbook-not-v3-check
      description: Verification runbook compares normal validation and offline rejection
      type: file_match
      asset_key: verification
      pattern: '^## A6\. Compare daemon-backed validation with offline rejection'
    - id: sk3-p3-runbook-tck
      description: Verification runbook judges an exported layout with kit-tck
      type: file_match
      asset_key: verification
      pattern: 'kit-tck validate --layout "\$WORK/layout" 0\.0\.0'
    - id: sk3-p3-runbook-strict-decoding
      description: Verification runbook checks strict decoding with a misspelled key
      type: file_match
      asset_key: verification
      pattern: "replace\\('capabilities:', 'capabilites:', 1\\)"
    - id: sk3-p3-runbook-scoped-cleanup
      description: Verification runbook removes only its own uniquely named builder
      type: file_match
      asset_key: verification
      pattern: 'if \[ "\$\{BUILDER_CREATED:-false\}" = true \]; then\s+if docker buildx rm "\$BUILDER"; then'
    - id: sk3-p3-runbook-no-unscoped-prune
      description: Verification runbook forbids unscoped prune as cleanup
      type: file_match
      asset_key: verification
      pattern: 'do not substitute `docker buildx prune`'
    - id: sk3-p3-runbook-no-publish
      description: Verification runbook never pushes or signs
      type: file_must_not_match
      asset_key: verification
      pattern: '--push\b|cosign (sign|verify)'

