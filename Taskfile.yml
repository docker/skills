version: '3'

tasks:
  default:
    desc: Run all CI checks
    cmds:
      - task: ci

  ci:
    desc: Run the same validation checks as CI and release workflows
    cmds:
      - bash scripts/ci.sh

  validate:
    desc: Validate skill structure, frontmatter, sections, and manifests
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d sh -c "pip install -q pyyaml && python3 -m unittest discover -s scripts -p 'test_*.py' && python3 scripts/validate.py"

  eval:
    desc: Run eval checks against skill asset files
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d sh -c "pip install -q pyyaml && python3 scripts/eval_check.py"

  links:
    desc: Check local Markdown links and heading anchors
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d python3 scripts/check_links.py
