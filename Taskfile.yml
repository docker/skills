version: '3'

tasks:
  default:
    desc: Run all CI checks
    cmds:
      - task: ci

  ci:
    desc: Run the same validation checks as CI and release workflows
    cmds:
      - bash scripts/ci.sh

  validate:
    desc: Validate skill structure, frontmatter, sections, and manifests
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d sh -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -qq --no-install-recommends git=1:2.47.3-0+deb13u1 >/dev/null && pip install -q --require-hashes -r scripts/requirements.txt && python3 -m unittest discover -s scripts -p 'test_*.py' && python3 scripts/validate.py"

  eval:
    desc: Run eval checks against skill asset files
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d sh -c "pip install -q --require-hashes -r scripts/requirements.txt && python3 scripts/eval_check.py"

  eval:judge:
    desc: Run LLM-as-judge evaluations for all skills (calls a live model; needs claude/codex and ANTHROPIC_API_KEY)
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -q --require-hashes -r scripts/requirements.txt
      - .venv/bin/python scripts/eval_judge.py {{.CLI_ARGS}}

  # Per-skill eval tasks
  eval:docker-agent-config:
    desc: Run evals for docker-agent-config skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-agent-config {{.CLI_ARGS}}" }

  eval:docker-agent-deploy:
    desc: Run evals for docker-agent-deploy skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-agent-deploy {{.CLI_ARGS}}" }

  eval:docker-agent-run:
    desc: Run evals for docker-agent-run skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-agent-run {{.CLI_ARGS}}" }

  eval:docker-build-strategies:
    desc: Run evals for docker-build-strategies skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-build-strategies {{.CLI_ARGS}}" }

  eval:docker-compose-patterns:
    desc: Run evals for docker-compose-patterns skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-compose-patterns {{.CLI_ARGS}}" }

  eval:docker-destructive-guardrails:
    desc: Run evals for docker-destructive-guardrails skill (flaky, not in CI)
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-destructive-guardrails {{.CLI_ARGS}}" }

  eval:docker-docs:
    desc: Run evals for docker-docs skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-docs {{.CLI_ARGS}}" }

  eval:docker-project-foundations:
    desc: Run evals for docker-project-foundations skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-project-foundations {{.CLI_ARGS}}" }

  eval:docker-sandboxes-env:
    desc: Run evals for docker-sandboxes-env skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-sandboxes-env {{.CLI_ARGS}}" }

  eval:docker-sandboxes-kits:
    desc: Run evals for docker-sandboxes-kits skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-sandboxes-kits {{.CLI_ARGS}}" }

  eval:docker-sandboxes-lifecycle:
    desc: Run evals for docker-sandboxes-lifecycle skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-sandboxes-lifecycle {{.CLI_ARGS}}" }

  eval:docker-sandboxes-network-credentials:
    desc: Run evals for docker-sandboxes-network-credentials skill
    cmds:
      - task: eval:judge
        vars: { CLI_ARGS: "--skill docker-sandboxes-network-credentials {{.CLI_ARGS}}" }

  catalog:
    desc: Regenerate catalog tables, skills.sh.json, and rendered plugin manifest versions from catalog.yaml
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d sh -c "pip install -q --require-hashes -r scripts/requirements.txt && python3 scripts/render_catalog.py"

  catalog:check:
    desc: Fail when generated catalog files or rendered manifest versions differ from catalog.yaml
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d sh -c "pip install -q --require-hashes -r scripts/requirements.txt && python3 scripts/render_catalog.py --check"

  release:prepare:
    desc: Prepare the catalog, generated files, and changelog for a distribution release
    requires:
      vars: [VERSION]
    env:
      RELEASE_VERSION: '{{.VERSION}}'
    cmds:
      - docker run --rm -e RELEASE_VERSION -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d sh -c 'pip install -q --require-hashes -r scripts/requirements.txt && python3 scripts/prepare_release.py "$RELEASE_VERSION"'

  links:
    desc: Check local Markdown links and heading anchors
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d python3 scripts/check_links.py

  links:external:
    desc: Check public HTTPS links (live network; separate from offline CI)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work:ro" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d python3 scripts/check_external_links.py

  images:inventory:
    desc: Inventory actionable container image references offline
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work:ro" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d python3 scripts/image_inventory.py

  images:check:
    desc: Check public image tags and amd64/arm64 availability (live network; separate from offline CI)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work:ro" -w /work python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d python3 scripts/check_images.py
