baseURL: https://docker.github.io/skills/
title: Docker Skills
disableKinds: [taxonomy, term]
disableAliases: true

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    permalinkable: false

outputs:
  home: [html, llms]

params:
  description: Docker-authored knowledge skills for AI coding agents.

refLinksErrorLevel: ERROR

markup:
  goldmark:
    renderer:
      unsafe: true

module:
  mounts:
    - source: index.md
      target: content/_index.md
    - source: getting-started
      target: content/getting-started
    - source: catalog
      target: content/catalog
    - source: community
      target: content/community
    - source: layouts
      target: layouts
    - source: assets
      target: assets
